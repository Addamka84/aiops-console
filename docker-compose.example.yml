# Example deployment (adapt addresses, image owner and tag).
# Secrets are provided as environment variables (e.g. Portainer stack environment), never in the config store:
#   CONSOLE_ADMIN_TOKEN  - full access (UI / you)
#   CONSOLE_READ_TOKEN   - read-only + may CREATE proposals (an assistant / automation)
#   CONSOLE_OPERATOR_TOKEN - optional: day-to-day operations (incidents, maintenance windows, replays, findings), no config writes
#   HA_WEBHOOK_URL       - optional Home Assistant webhook for notifications

services:
  aiops:
    image: ghcr.io/OWNER/aiops-console:v2.0.0-alpha.43
    container_name: aiops
    restart: unless-stopped
    environment:
      TZ: UTC
      VL_URL: http://victorialogs:9428
      OLLAMA_URLS: http://ollama-host:11434
      MODEL: qwen3.5:9b
      HA_WEBHOOK_URL: ${HA_WEBHOOK_URL:-}
      CONSOLE_ADMIN_TOKEN: ${CONSOLE_ADMIN_TOKEN:?set CONSOLE_ADMIN_TOKEN}
      CONSOLE_READ_TOKEN: ${CONSOLE_READ_TOKEN:-}
      CONSOLE_OPERATOR_TOKEN: ${CONSOLE_OPERATOR_TOKEN:-}
    ports:
      - "127.0.0.1:8095:8095"   # bind to a LAN address instead if you need remote access
    volumes:
      - aiops_data:/data
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m

volumes:
  aiops_data:

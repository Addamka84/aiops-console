name: image

# Test on every push / PR; publish the image to GHCR when a version tag (v*) is pushed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aiops-console"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          # A pre-release tag (e.g. v2.0.0-alpha.1) never moves `latest`.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "tags=$image:$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            printf 'tags=%s:%s,%s:latest\n' "$image" "$GITHUB_REF_NAME" "$image" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
